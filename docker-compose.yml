# FLEETBOARD, built from this checkout:  docker compose up -d --build
# Servers that only deploy releases use the docker-compose.yml attached to each
# GitHub Release instead (GHCR images, auto-updating). All config comes from .env.
name: fleetboard

x-db-url: &db-url ${DATABASE_URL:-postgres://${POSTGRES_USER:-fleetboard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fleetboard}}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fleetboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [fleet]

  collector:
    build:
      context: .
      dockerfile: infra/Dockerfile.collector
    image: fleetboard-collector:local
    restart: unless-stopped
    environment:
      TOKEN: ${TOKEN:?set TOKEN in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: *db-url
      DIFF_NODE: ${DIFF_NODE:-xmr.support:18081}
      XEL_NODE: ${XEL_NODE:-https://node.xelis.io/json_rpc}
      XMR_WALLET_RPC: ${XMR_WALLET_RPC:-}
      XEL_WALLET_RPC: ${XEL_WALLET_RPC:-}
      XEL_WALLET_USER: ${XEL_WALLET_USER:-}
      XEL_WALLET_PASS: ${XEL_WALLET_RPC_PASS:-}
      HISTORY_DAYS: ${HISTORY_DAYS:-90}
    depends_on:
      db:
        condition: service_healthy
    networks: [fleet, wallets]

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    image: fleetboard-web:local
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: *db-url
    depends_on:
      collector:
        condition: service_healthy
    networks: [fleet]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:80:80"
      - "${BIND_ADDR:-127.0.0.1}:443:443"
      - "${BIND_ADDR:-127.0.0.1}:443:443/udp"
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      collector:
        condition: service_healthy
    networks: [fleet]

  # Optional: wallets co-hosted on the server ("docker compose --profile wallets ...").
  # Only the collector shares their network; web and caddy cannot reach them.
  xmr-wallet:
    profiles: [wallets]
    build:
      context: .
      dockerfile: infra/Dockerfile.wallet-xmr
    image: fleetboard-wallet-xmr:local
    restart: unless-stopped
    environment:
      WALLET_PASSWORD: ${XMR_WALLET_PASSWORD:-}
      XMR_NODE: ${DIFF_NODE:-xmr.support:18081}
      RESTORE_HEIGHT: ${XMR_RESTORE_HEIGHT:-0}
    volumes:
      - xmr_wallet:/data
    networks: [wallets]

  xel-wallet:
    profiles: [wallets]
    build:
      context: .
      dockerfile: infra/Dockerfile.wallet-xel
    image: fleetboard-wallet-xel:local
    restart: unless-stopped
    environment:
      WALLET_PASSWORD: ${XEL_WALLET_PASSWORD:-}
      RPC_PASSWORD: ${XEL_WALLET_RPC_PASS:-}
      XEL_DAEMON: ${XEL_DAEMON:-https://node.xelis.io}
    volumes:
      - xel_wallet:/data
    networks: [wallets]

networks:
  fleet: {}
  wallets: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  xmr_wallet: {}
  xel_wallet: {}
