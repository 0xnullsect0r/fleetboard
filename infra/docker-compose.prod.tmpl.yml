# FLEETBOARD __TAG__: production stack from GHCR images.
#
#   curl -fsSLO https://github.com/__REPO__/releases/latest/download/docker-compose.yml
#   curl -fsSL  https://raw.githubusercontent.com/__REPO__/main/.env.example -o .env   # then edit
#   docker compose up -d
#
# web + collector follow FLEETBOARD_TAG (default "latest"); the updater service
# pulls new GHCR releases and restarts just those two. Pin a version with
# FLEETBOARD_TAG=v1.2.3 in .env. Everything else is configured in .env.
name: fleetboard

x-db-url: &db-url ${DATABASE_URL:-postgres://${POSTGRES_USER:-fleetboard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fleetboard}}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fleetboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [fleet]

  collector:
    image: ghcr.io/__OWNER__/fleetboard-collector:${FLEETBOARD_TAG:-latest}
    restart: unless-stopped
    environment:
      TOKEN: ${TOKEN:?set TOKEN in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: *db-url
      DIFF_NODE: ${DIFF_NODE:-xmr.support:18081}
      XEL_NODE: ${XEL_NODE:-https://node.xelis.io/json_rpc}
      XMR_WALLET_RPC: ${XMR_WALLET_RPC:-}
      XEL_WALLET_RPC: ${XEL_WALLET_RPC:-}
      XEL_WALLET_USER: ${XEL_WALLET_USER:-}
      XEL_WALLET_PASS: ${XEL_WALLET_RPC_PASS:-}
      HISTORY_DAYS: ${HISTORY_DAYS:-90}
    depends_on:
      db:
        condition: service_healthy
    networks: [fleet, wallets]

  web:
    image: ghcr.io/__OWNER__/fleetboard-web:${FLEETBOARD_TAG:-latest}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: *db-url
    depends_on:
      collector:
        condition: service_healthy
    networks: [fleet]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:80:80"
      - "${BIND_ADDR:-127.0.0.1}:443:443"
      - "${BIND_ADDR:-127.0.0.1}:443:443/udp"
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      collector:
        condition: service_healthy
    networks: [fleet]

  # Every UPDATE_INTERVAL seconds: pull web/collector for the current tag and
  # recreate a service only if its image digest changed (migrations run on
  # collector boot). db, caddy and wallets are never touched. Official Docker
  # CLI image; needs the socket. Waits one interval first so it never races
  # the initial "docker compose up".
  updater:
    image: docker:27-cli
    restart: unless-stopped
    working_dir: /srv/fleetboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/srv/fleetboard/docker-compose.yml:ro
      - ./.env:/srv/fleetboard/.env:ro
    environment:
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "updater: checking GHCR every $${UPDATE_INTERVAL}s"
        while :; do
          sleep "$${UPDATE_INTERVAL}"
          if ! docker compose pull --quiet web collector >/dev/null 2>&1; then
            echo "updater: pull failed (GHCR unreachable or packages private?)"
            continue
          fi
          for svc in web collector; do
            cid="$$(docker compose ps -q "$$svc")"
            [ -n "$$cid" ] || continue
            ref="$$(docker inspect -f '{{.Config.Image}}' "$$cid")"
            if [ "$$(docker inspect -f '{{.Image}}' "$$cid")" != "$$(docker image inspect -f '{{.Id}}' "$$ref")" ]; then
              echo "updater: new image for $$svc ($$ref), recreating"
              docker compose up -d --no-deps "$$svc"
            fi
          done
        done
    networks: [fleet]

  # Optional: wallets co-hosted on the server ("docker compose --profile wallets ...").
  # Only the collector shares their network; web and caddy cannot reach them.
  xmr-wallet:
    profiles: [wallets]
    image: ghcr.io/__OWNER__/fleetboard-wallet-xmr:${FLEETBOARD_TAG:-latest}
    restart: unless-stopped
    environment:
      WALLET_PASSWORD: ${XMR_WALLET_PASSWORD:-}
      XMR_NODE: ${DIFF_NODE:-xmr.support:18081}
      RESTORE_HEIGHT: ${XMR_RESTORE_HEIGHT:-0}
    volumes:
      - xmr_wallet:/data
    networks: [wallets]

  xel-wallet:
    profiles: [wallets]
    image: ghcr.io/__OWNER__/fleetboard-wallet-xel:${FLEETBOARD_TAG:-latest}
    restart: unless-stopped
    environment:
      WALLET_PASSWORD: ${XEL_WALLET_PASSWORD:-}
      RPC_PASSWORD: ${XEL_WALLET_RPC_PASS:-}
      XEL_DAEMON: ${XEL_DAEMON:-https://node.xelis.io}
    volumes:
      - xel_wallet:/data
    networks: [wallets]

configs:
  caddyfile:
    content: |
      ${CADDY_SITE_ADDRESS:-localhost} {
      	encode zstd gzip
      	handle /ws/* {
      		reverse_proxy collector:4000
      	}
      	handle {
      		reverse_proxy web:3000
      	}
      }

      http://:8080 {
      	handle /ws/agent {
      		reverse_proxy collector:4000
      	}
      	handle {
      		respond "fleetboard agent ingress" 404
      	}
      }

networks:
  fleet: {}
  wallets: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  xmr_wallet: {}
  xel_wallet: {}
